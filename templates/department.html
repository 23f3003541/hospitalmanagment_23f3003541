<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Departments - Hospital Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .header { text-align: center; margin-bottom: 40px; }
        .dept-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .dept-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .dept-card h3 { margin: 0 0 10px 0; color: #0288d1; }
        .dept-card p { margin: 10px 0; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Hospital Departments</h1>
            <p>Select a department to view doctors</p>
        </div>
        
        <div class="dept-grid">
            {% for dept in departments %}
            <div class="dept-card">
                <h3>{{ dept.name }}</h3>
                <p>{{ dept.description if dept.description else 'No description available' }}</p>
                <a href="{{ url_for('department_doctors', dept_id=dept.id) }}" class="btn">View Doctors</a>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
