<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Patient Registration - Hospital Management System</title>
	<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
	<div class="register-container">
		<h2>Patient Registration</h2>
		{% if error %}
			<div class="error">{{ error }}</div>
		{% endif %}
		{% if message %}
			<div class="message">{{ message }}</div>
		{% endif %}
		<form method="POST" action="{{ url_for('patientreg') }}">
			<div class="form-group">
				<label for="u_name">Username</label>
				<input type="text" id="u_name" name="u_name" required>
			</div>
			<div class="form-group">
				<label for="pwdp">Password</label>
				<input type="password" id="pwdp" name="pwdp" required>
			</div>
			<div class="form-group">
				<label for="name1">Full Name</label>
				<input type="text" id="name1" name="name1" required>
			</div>
			<div class="form-group">
				<label for="DOB">Date of Birth</label>
				<input type="date" id="DOB" name="DOB" required>
			</div>
			<div class="form-group">
				<label for="gender">Gender</label>
				<select id="gender" name="gender" required>
					<option value="">Select Gender</option>
					<option value="Male">Male</option>
					<option value="Female">Female</option>
					<option value="Other">Other</option>
				</select>
			</div>
			<div class="form-group">
				<label for="blood_group">Blood Group</label>
				<select id="blood_group" name="blood_group" required>
					<option value="">Select Blood Group</option>
					<option value="A+">A+</option>
					<option value="A-">A-</option>
					<option value="B+">B+</option>
					<option value="B-">B-</option>
					<option value="AB+">AB+</option>
					<option value="AB-">AB-</option>
					<option value="O+">O+</option>
					<option value="O-">O-</option>
				</select>
			</div>
			<button type="submit">Register</button>
		</form>
	</div>
</body>
</html>
